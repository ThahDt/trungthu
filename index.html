<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trung Thu – Nơi chia sẻ yêu thương và gửi trao lời chúc ý nghĩa." />
    <title>Trung Thu Yêu Thương</title>
    <link rel="icon" href="den.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to top, rgb(6, 0, 20), #00020a);
            margin: 0;
            padding: 0;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            display: block;
            pointer-events: none;
        }

        .moon {
            position: fixed;
            top: 50px;
            right: 80px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #fff, #ddd 70%);
            border-radius: 50%;
            box-shadow:
                0 0 30px rgba(255, 255, 200, 0.8),
                0 0 60px rgba(255, 255, 180, 0.6),
                0 0 90px rgba(255, 255, 150, 0.4);
            z-index: 0;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .moon {
                top: 20px;
                right: 20px;
                width: 70px;
                height: 70px;
                box-shadow:
                    0 0 15px rgba(255, 255, 200, 0.8),
                    0 0 30px rgba(255, 255, 180, 0.6),
                    0 0 50px rgba(255, 255, 150, 0.4);
            }
        }

        #lantern-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .lantern {
            position: absolute;
            bottom: 0;
            width: 40px;
            opacity: 0.9;
            user-select: none;
            will-change: transform, opacity;
            filter: drop-shadow(0 0 6px rgba(255, 150, 50, 0.7));
            cursor: pointer;
        }

        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.3;
            display: flex;
            color: #d97706;
            font-family: "Mali", cursive;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            text-align: center;
            width: 80%;
            padding: 0 16px;
            pointer-events: none;
        }

        .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            margin: 0 6px;
            transition: opacity 0.45s ease-out, transform 0.45s ease-out;
        }

        .word.show {
            opacity: 1;
            transform: translateY(0);
        }

        .word.hide {
            opacity: 0;
            transform: translateY(-20px);
        }

        #invite-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(18, 12, 38, 0.94);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            font-family: "Mali", cursive;
            padding: 35px 45px;
            border-radius: 20px;
            border: 2px solid #f59e0b;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.5), 0 10px 40px rgba(0, 0, 0, 0.7);
            text-align: center;
            z-index: 10001;
            animation: popupScale 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90vw;
        }

        @keyframes popupScale {
            from {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 0;
            }

            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        #invite-box p {
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 25px;
            color: #fef08a;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
            letter-spacing: 0.5px;
        }

        #invite-box button {
            border: 2px solid #fbbf24;
            outline: none;
            padding: 12px 28px;
            margin: 8px 6px;
            border-radius: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: "Mali", cursive;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            user-select: none;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        #btn-ok {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5);
        }

        #btn-ok:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.75);
            background: linear-gradient(135deg, #fbbf24, #d97706);
        }

        #btn-no {
            background: linear-gradient(135deg, #d97706, #b45309);
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
            max-width: 100%;
            white-space: normal;
        }

        #btn-no:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.65);
        }

        #btn-no.enlarge {
            transform: scale(1.35);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.9), 0 8px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
            animation: pulseGlow 1.2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px rgba(251, 191, 36, 0.7);
            }
            100% {
                box-shadow: 0 0 30px rgba(251, 191, 36, 1);
            }
        }

        @media (max-width: 600px) {
            #invite-box {
                width: 88vw;
                max-width: 330px;
                padding: 26px 18px;
            }

            #invite-box p {
                font-size: 1.45rem;
                margin-bottom: 16px;
            }

            #invite-box button {
                padding: 10px 18px;
                font-size: 1rem;
            }

            #btn-no.enlarge {
                transform: scale(1.18);
            }
        }

        #wish-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #d97706;
            font-family: "Mali", cursive;
            padding: 35px 25px;
            border-radius: 14px;
            font-size: 1.4rem;
            font-weight: bold;
            display: none;
            z-index: 10000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            text-align: center;
            max-width: 85vw;
            line-height: 1.5;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #wish-popup {
                padding: 24px 16px;
                font-size: 1.15rem;
            }

            #message {
                font-size: 1.5rem;
                padding: 0 12px;
            }
        }

        #hint {
            position: fixed;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff6b2;
            text-shadow: 0 0 10px rgba(255, 255, 200, 0.9);
            z-index: 10001;
            opacity: 0;
            transition: opacity 1s ease;
            white-space: pre-line;
            text-align: center;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            #hint {
                font-size: 1.05rem;
                width: 90%;
            }
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-5px);
            }

            40% {
                transform: translateX(5px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .shake {
            animation: shake 0.5s;
        }

        #skywatchers {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            max-width: 90%;
            z-index: 2;
            opacity: 0.85;
            pointer-events: none;
            user-select: none;
        }

        /* Nút bật/tắt nhạc */
        #music-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10002;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            transition: transform 0.2s, background 0.2s;
            user-select: none;
        }

        #music-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>

<body>
    <!-- Nút bật/tắt nhạc nền -->
    <button id="music-toggle" aria-label="Bật/Tắt nhạc" title="Bật hoặc Tắt nhạc nền">🎵</button>

    <canvas id="starfield"></canvas>
    <div class="moon"></div>
    <div id="message"></div>
    <div id="lantern-container"></div>

    <div id="invite-box">
        <p>Đi chơi với anh nhé?</p>
        <div class="btn-group">
            <button id="btn-ok">Ok</button>
            <button id="btn-no">Không</button>
        </div>
    </div>

    <div id="wish-popup"></div>
    <img src="as.png" alt="Couple watching sky" id="skywatchers">

    <audio id="bg-music" loop preload="auto">
        <source src="a.mp3" type="audio/mpeg">
    </audio>

    <script>
        const bgMusic = document.getElementById("bg-music");
        const musicToggle = document.getElementById("music-toggle");
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicToggle.textContent = "🔇";
                isPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicToggle.textContent = "🎵";
                    isPlaying = true;
                }).catch((err) => {
                    console.log("Không phát được nhạc: ", err);
                });
            }
        }

        // Tự động bật nhạc khi người dùng tương tác lần đầu
        const startMusicOnFirstClick = () => {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    musicToggle.textContent = "🎵";
                    isPlaying = true;
                }).catch(() => {});
            }
            document.removeEventListener("click", startMusicOnFirstClick);
        };
        document.addEventListener("click", startMusicOnFirstClick);

        musicToggle.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleMusic();
        });
    </script>
    <script src="script.js" defer></script>
</body>

</html>
